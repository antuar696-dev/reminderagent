name: Morning AI Assistant

on:
  schedule:
    # 00:00 UTC = 06:00 Bangladesh time (UTC+6)
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  morning-plan:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y mistralai || true
          pip install -r requirements.txt

      - name: Check Mistral version
        run: |
          pip show mistralai

      - name: Run Morning AI Agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ACCUWEATHER_API_KEY: ${{ secrets.ACCUWEATHER_API_KEY }}

        run: |
          python morning_agent.py
